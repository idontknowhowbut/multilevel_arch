{{define "content"}}
<section class="page narrow">
    <h1>AUTH</h1>

    <div class="card auth-grid">
        <form id="login-form">
            <h2>Войти</h2>
            <label>Логин<input id="login" required autocomplete="username"></label>
            <label>Пароль<input id="password" type="password" required autocomplete="current-password"></label>
            <button class="button primary" type="submit">Войти</button>
            <p id="login-error" class="error"></p>
        </form>

        <form id="signup-form">
            <h2>Регистрация</h2>
            <label>Логин<input id="signup-login" required autocomplete="username"></label>
            <label>Пароль<input id="signup-password" type="password" required autocomplete="new-password"></label>
            <button class="button" type="submit">Создать аккаунт</button>
            <p id="signup-error" class="error"></p>
        </form>
    </div>
</section>
{{end}}
