{{define "content"}}

    <span class="eyebrow">HISTORY / 04</span>
    <h1>ИСТОРИЯ<br><span class="accent">МАТЧЕЙ.</span></h1>
    <p>Завершённые игры текущего пользователя из <code>GET /userGames</code>.</p>
</header>

<div class="section-heading standalone-heading">

<div id="history-loading" class="loading-line">Загрузка истории...</div>
<div id="history-error" class="error-box hidden"></div>

<script defer src="/static/js/history.js"></script>
{{end}}
