{{define "sidebar"}}
<aside class="site-sidebar">
    <a class="brand" href="/">
        <span class="brand__title">TIC<br>TAC<br>TOE</span>
        <span class="brand__subtitle">terminal edition</span>
    </a>

    <nav class="sidebar-nav">
        <a class="nav-link {{if eq .Active "home"}}active{{end}}" href="/">Главная</a>
        <a class="nav-link {{if eq .Active "play"}}active{{end}}" href="/play">Играть</a>
        <a class="nav-link {{if eq .Active "leaderboard"}}active{{end}}" href="/leaderboard">Лидеры</a>
        <a class="nav-link {{if eq .Active "history"}}active{{end}}" href="/history">История</a>
        <a class="nav-link {{if eq .Active "about"}}active{{end}}" href="/about">О проекте</a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div id="session-box" class="session-box">
        <div class="session-status">
            <span class="status-dot"></span>
            <div>
                <strong id="session-title">OFFLINE</strong>
                <span id="session-user">Не выполнен вход</span>
            </div>
        </div>
        <a id="login-link" class="sidebar-action" href="/login">Войти / регистрация</a>
        <button id="logout-button" class="sidebar-action hidden" type="button">Выйти</button>
    </div>
</aside>
{{end}}
